# Nginx-Konfiguration fuer WordPress-Sites
# Wird von den Service-Scripts geladen

# Upstream zu PHP-FPM
upstream php_backend {
    server 127.0.0.1:9000;
}

# Server-Block fuer alle WordPress-Sites unter /sites/<name>/
# Wird auf Port 8080 gehostet, von Caddy (Port 8000) ueber Reverse-Proxy weitergeleitet
server {
    listen 8080;
    server_name _;

    # Root ist /data (nicht /data/sites!) weil wir Pfade wie /sites/test-full/ haben
    root /data;

    # Logs
    access_log /var/log/nginx/wordpress.access.log;
    error_log /var/log/nginx/wordpress.error.log;

    # Index-Dateien
    index index.php index.html;

    # Kompressionsoption
    gzip on;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript;
    gzip_vary on;

    # PHP-FPM-Proxy fuer .php-Dateien (MUSS VOR location ~ ^/sites)
    location ~ \.php$ {
        # Nur unter /sites/<name>/ erlaubt
        if ($uri !~ ^/sites/[a-z0-9-]+/) {
            return 403;
        }

        # PHP-FPM-Backend
        fastcgi_pass php_backend;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        include fastcgi_params;

        # Timeouts erhoehen (WordPress kann langsam sein)
        fastcgi_read_timeout 60s;
        fastcgi_connect_timeout 10s;
    }

    # WordPress-Sites unter /sites/<name>/*
    location ~ ^/sites/([a-z0-9-]+)(/|$) {
        set $site_name $1;
        set $site_root /data/sites/$site_name;

        # Pruefen: ist das eine WordPress-Site? (wp-config.php existiert)
        if (!-f "$site_root/wp-config.php") {
            return 404;
        }

        # Statische Dateien durchlassen
        if (-f $request_filename) {
            access_log off;
            expires 30d;
            break;
        }

        # WordPress: Pretty permalinks – alles zu index.php
        if (!-d $request_filename) {
            rewrite ^/sites/([a-z0-9-]+)(/?.*)$ /sites/$1/index.php break;
        }
    }

    # Sicherheit: keine .htaccess, wp-config, etc.
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~ wp-config\.php {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Weitere Sicherheit: wp-admin Pfade limitieren (optional, aber sinnvoll)
    # location ~ ^/sites/[a-z0-9-]+/wp-admin/$ {
    #     # Hier könnte man später IP-Whitelisting hinzufügen
    # }

    # X-Frame-Options, X-Content-Type-Options Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
}

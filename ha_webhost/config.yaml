name: "HA WebHost"
version: "0.1.24"
slug: "ha_webhost"
description: "Statisches Website-Hosting direkt in Home Assistant (MVP)"
url: "https://github.com/stespr86-create/ha-webhost"
arch:
  - aarch64
  - amd64
  - armv7
init: false
ingress: true
ingress_port: 8000
panel_icon: mdi:web
panel_title: WebHost
startup: services
boot: auto
# 8000: optionaler direkter Zugriff auf ALLES (Admin-UI + API + Sites)
# ohne HA-Login. Standardmäßig deaktiviert (null) - bewusst NICHT für
# öffentliche/Internet-Freigabe geeignet (würde das Admin-Panel mit
# exponieren). Nur für vertrauenswürdiges LAN gedacht.
#
# 8090: NUR /sites/<name>/* - niemals Admin-UI/API. Fest aktiviert,
# gedacht für öffentliche Erreichbarkeit (z.B. via Tailscale Funnel).
ports:
  8000/tcp: null
  8090/tcp: 8090
ports_description:
  8000/tcp: "Optional: direkter Zugriff auf ALLES (auch Admin!) ohne HA-Anmeldung - nur LAN"
  8090/tcp: "Nur gehostete Sites (kein Admin-Zugriff) - für öffentliche Freigabe gedacht"
options: {}
schema: {}
